# Deploy from repo root (not backend/). Service Settings → Root Directory should be empty or "."
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Use Dockerfile CMD (PYTHONPATH=/app, uvicorn on $PORT). Override only if not using Docker.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
